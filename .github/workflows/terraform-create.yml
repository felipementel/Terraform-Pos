name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment configuration to apply
        required: true
        type: choice
        options: [dev, hom]
      repo_name:
        description: Repository name managed by Terraform
        required: true
      repo_description:
        description: Repository description
        required: false
        default: ""
      repo_visibility:
        description: Repository visibility
        required: true
        type: choice
        default: public
        options: [public, private]
      sonar_organization:
        description: SonarCloud organization
        required: true
        default: felipementel
      deploy_target:
        description: Deployment target
        required: true
        type: choice
        default: ACA
        options: [ACA, AKS (desabilitado)]
      framework:
        description: Application framework
        required: true
        default: dotnet
      build_version:
        description: Runtime or SDK version
        required: true
        default: "10"

permissions:
  contents: read

jobs:
  apply:
    name: Apply ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: IaC
    env:
      GITHUB_TOKEN: ${{ secrets.TF_VAR_GITHUB_TOKEN }}
      TF_VAR_repo_name: ${{ inputs.repo_name }}
      TF_VAR_repo_description: ${{ inputs.repo_description }}
      TF_VAR_repo_visibility: ${{ inputs.repo_visibility }}
      TF_VAR_github_username: ${{ vars.GITHUB_USERNAME }}
      TF_VAR_sonar_token: ${{ secrets.TF_VAR_SONAR_TOKEN }}
      TF_VAR_sonar_project_key: ${{ inputs.repo_name }}
      TF_VAR_sonar_project_name: ${{ inputs.repo_name }}
      TF_VAR_sonar_organization: ${{ inputs.sonar_organization }}
      TF_VAR_snyk_api_key: ${{ secrets.TF_VAR_SNYK_API_KEY }}
      TF_VAR_deploy_target: ${{ inputs.deploy_target }}
      TF_VAR_framework: ${{ inputs.framework }}
      TF_VAR_build_version: ${{ inputs.build_version }}
      TF_VAR_otlp_honeycomb_headers: ${{ secrets.TF_VAR_OTLP_HONEYCOMB_HEADERS }}
      STORAGE_ACCOUNT_NAME: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      STORAGE_CONTAINER_NAME: ${{ vars.TF_STATE_STORAGE_CONTAINER }}
      STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_ACCOUNT_SAS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure Azure and Terraform credentials
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          echo "TF_VAR_arm_client_id=$(jq -r '.clientId' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "TF_VAR_arm_client_secret=$(jq -r '.clientSecret' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "TF_VAR_arm_subscription_id=$(jq -r '.subscriptionId' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "TF_VAR_arm_tenant_id=$(jq -r '.tenantId' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"

      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v4

      - name: Restore Terraform state
        run: |
          set -euo pipefail
          test -n "$STORAGE_ACCOUNT_NAME" && test -n "$STORAGE_CONTAINER_NAME"
          echo "::add-mask::$STORAGE_SAS_TOKEN"
          SAS="$(printf '%s' "$STORAGE_SAS_TOKEN" | sed 's|^https://[^?]*?||; s/^?//')"
          az storage blob download --only-show-errors \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --container-name "$STORAGE_CONTAINER_NAME" \
            --name "${{ inputs.repo_name }}/terraform-${{ inputs.environment }}.tfstate" \
            --file terraform.tfstate \
            --sas-token "$SAS" || echo "::notice::No prior state found; this is the first apply."

      - name: Terraform init, format, and validate
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan -var-file="environments/${{ inputs.environment }}.tfvars"

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Persist Terraform state
        if: success()
        run: |
          set -euo pipefail
          echo "::add-mask::$STORAGE_SAS_TOKEN"
          SAS="$(printf '%s' "$STORAGE_SAS_TOKEN" | sed 's|^https://[^?]*?||; s/^?//')"
          az storage blob upload --only-show-errors --overwrite \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --container-name "$STORAGE_CONTAINER_NAME" \
            --name "${{ inputs.repo_name }}/terraform-${{ inputs.environment }}.tfstate" \
            --file terraform.tfstate \
            --sas-token "$SAS"
